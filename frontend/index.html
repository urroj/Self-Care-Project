<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cycle.tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }

      body {
        font-family: "Press Start 2P", "Courier New", monospace;
        -webkit-font-smoothing: none;
        image-rendering: pixelated;
        line-height: 1.8;
        min-height: 100vh;
        /* Pink-mauve gradient — no purple */
        background:
          radial-gradient(ellipse at 15% 18%, rgba(255,220,235,0.60) 0%, transparent 50%),
          radial-gradient(ellipse at 82% 78%, rgba(220,130,170,0.45) 0%, transparent 50%),
          linear-gradient(150deg,
            #FFD0E8 0%,
            #F4A8D0 18%,
            #E888BC 38%,
            #D870A8 58%,
            #C86098 78%,
            #B85088 100%
          );
        background-attachment: fixed;
      }

/* DEFAULT PIXEL CURSOR */
      html,
      body,
      * {
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' shape-rendering='crispEdges'><path d='M2 2 L2 22 L7 17 L11 27 L15 25 L11 15 L18 15 Z' fill='white' stroke='black' stroke-width='2' stroke-linejoin='miter'/></svg>") 2 2, auto;
      }

      /* TEXT INPUTS */
      input[type="text"],
      input[type="password"],
      input[type="email"],
      input[type="search"],
      input[type="number"],
      input[type="url"],
      input[type="tel"],
      textarea,
      [contenteditable="true"] {
        cursor: text;
      }

      /* ALL CLICKABLE ELEMENTS */
    a,
    button,
    label,
    summary,
    select,
    option,
    details,
    [role="button"],
    [role="link"],
    [onclick],
    [tabindex]:not([tabindex="-1"]),
    input[type="button"],
    input[type="submit"],
    input[type="reset"],
    input[type="checkbox"],
    input[type="radio"],
    input[type="range"],
    input[type="file"],
    input[type="color"] {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' shape-rendering='crispEdges'><path d='M7 2 H10 V11 H12 V4 H15 V11 H17 V6 H20 V15 H22 V10 H24 V20 H22 V24 H10 L5 18 V11 H7 Z' fill='white' stroke='black' stroke-width='1.5' stroke-linejoin='miter'/></svg>") 8 2, pointer;
    }

      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: rgba(255,180,210,0.25); border: 1px solid rgba(200,80,130,0.25); }
      ::-webkit-scrollbar-thumb { background: #E87090; border: 2px solid #7A1A38; }
      ::-webkit-scrollbar-thumb:hover { background: #C4506A; }
      ::-webkit-scrollbar-corner { background: transparent; }

      ::selection { background: #E87090; color: #FFFFFF; }
      ::placeholder { color: #C490A8; font-family: "Press Start 2P", monospace; font-size: 7px; }

      #root { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx">
    </script>
  </body>
</html>
